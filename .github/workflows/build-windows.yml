name: Build Windows app

# Builds the TechVision Backup Windows installer (.exe) automatically:
# - on every pull request (so a broken build is caught before merge)
# - on every push to main (so the merged code always has a ready installer)
# - manually from the Actions tab (Run workflow)
#
# The installer is attached to each run as a downloadable artifact.
# On pushes to main it is also published as a GitHub Release, so the
# user only downloads one .exe and double-clicks it — no Node, npm
# or git needed on their Windows machine.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build -- --win

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechVision-Backup-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish a Release (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TechVision Backup build ${{ github.run_number }}
          files: dist/*
          fail_on_unmatched_files: false
